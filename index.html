<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Poster</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

<div class="poster">

    <div class="overlay">

        <div class="content">
            <h3>2026</h3>

            <h1>SHADOW</h1>

            <p class="tagline">
                "Darkness has a new hero."
            </p>

            <div class="genre">
                <span>Action</span>
                <span>Sci-Fi</span>
                <span>Adventure</span>
            </div>

            <div class="rating">
                ⭐ 9.4 / 10
            </div>

            <button>▶️ Watch Trailer</button>

        </div>

    </div>

</div>

</body>
</html>
